<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>CVE-X</title>
<meta name="description" content="page personnelle">
<link rel="icon" href="assets/avatar.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent: #ffffff;
  --text: #f2f2f2;
  --text-muted: #9a9a9a;
  --card-bg: #0c0c0c;
  --card-border: rgba(255,255,255,0.14);
}

*{ box-sizing: border-box; }

html,body{
  margin:0; padding:0; min-height:100%;
  background:#000;
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  overflow-x:hidden;
}

::selection{ background: var(--accent); color:#000; }

#bg-layer{
  position: fixed; inset:0;
  z-index:0;
  background:#000;
}
#lightning{
  position:absolute; inset:0;
  width:100%; height:100%;
}
.bolt{
  fill:none;
  stroke:#fff;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter: url(#glow);
  opacity:0.55;
}
.bolt-1{ animation: flicker 6s ease-in-out infinite; }
.bolt-2{ animation: flicker 4.5s ease-in-out infinite 1.2s; }
.bolt-3{ animation: flicker 5.5s ease-in-out infinite 2.4s; }
@keyframes flicker{
  0%, 100%{ opacity:0.45; }
  4%{ opacity:0.9; }
  6%{ opacity:0.3; }
  8%{ opacity:0.8; }
  50%{ opacity:0.5; }
  53%{ opacity:0.95; }
  55%{ opacity:0.4; }
}

#gate{
  position: fixed; inset:0;
  z-index: 50;
  display:flex; align-items:center; justify-content:center;
  background: transparent;
  cursor: pointer;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#gate.hidden{ opacity:0; visibility:hidden; }
.gate-hint{
  margin:0;
  font-size: 0.8rem;
  letter-spacing:0.04em;
  color: var(--text-muted);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:0.35;} 50%{opacity:0.9;} }

#card{
  position:relative;
  z-index: 5;
  width: 92%;
  max-width: 460px;
  margin: 8vh auto 4rem;
  padding: 2rem 1.9rem 1.7rem;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  text-align:center;
  opacity:0;
  transform: translateY(10px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
#card.reveal{ opacity:1; transform:none; }

.views-row{
  position:absolute;
  top:16px; right:18px;
  display:flex; align-items:center; gap:5px;
  font-size:0.78rem;
  color: var(--text-muted);
}
.eye-icon{ width:15px; height:15px; fill: var(--text-muted); }

#avatar{
  width:88px; height:88px;
  border-radius:50%;
  object-fit:cover;
  border: 2px solid rgba(255,255,255,0.18);
  background:#1a1a1a;
  display:block;
  margin: 0 auto 0.9rem;
}

#name{
  font-weight:700;
  font-size: 1.35rem;
  margin: 0 0 0.4rem;
  color:#fff;
}
#bio{
  font-size: 0.78rem;
  font-weight:600;
  color: var(--text-muted);
  margin: 0 0 1.3rem;
}

#links{
  display:flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  justify-content:center;
  margin-bottom: 1.5rem;
}
.link-btn{
  display:flex; align-items:center; justify-content:center;
  width:38px; height:38px;
  border-radius:50%;
  border: 1.4px solid rgba(255,255,255,0.35);
  color:#fff;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.link-btn:hover{
  border-color: var(--accent);
  transform: translateY(-1px);
}
.link-btn svg{ width:16px; height:16px; fill: currentColor; }

.divider{
  height:1px;
  background: rgba(255,255,255,0.14);
  margin: 1.3rem 0;
}

#player{
  display:flex; align-items:center; gap:0.85rem;
  text-align:left;
  margin-bottom: 0.7rem;
}
#cover{
  width:56px; height:56px;
  border-radius:8px;
  object-fit:cover;
  background:#1a1a1a;
  flex:0 0 auto;
}
.track-info{ flex:1; min-width:0; }
#track-title{
  margin:0; font-size:0.82rem; font-weight:600; color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#track-artist, #track-album{
  margin:0.1rem 0 0; font-size:0.72rem; color: var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.progress-wrap{ width:100%; }
#progress-bar{
  width:100%; height:4px;
  border-radius:999px;
  background: rgba(255,255,255,0.15);
  cursor:pointer;
  overflow:hidden;
}
#progress-fill{
  height:100%; width:0%;
  background: var(--accent);
  border-radius:999px;
}
.player-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.5rem;
}
#time{
  margin: 0;
  font-size:0.7rem;
  color: var(--text-muted);
}
.player-actions {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.control-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 6px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.control-btn:hover {
  border-color: var(--accent);
  background: rgba(255,255,255,0.05);
}
.control-btn svg {
  width: 12px;
  height: 12px;
  fill: currentColor;
}
.volume-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 2px;
}
.volume-wrap svg {
  width: 13px;
  height: 13px;
  fill: var(--text-muted);
}
#volume-slider {
  width: 50px;
  height: 4px;
  appearance: none;
  background: rgba(255,255,255,0.15);
  border-radius: 999px;
  outline: none;
  cursor: pointer;
}
#volume-slider::-webkit-slider-thumb {
  appearance: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

#buttons{
  display:flex; flex-direction:column; gap:0.6rem;
}
.custom-btn{
  width:100%;
  padding: 0.65rem 1rem;
  font-family:inherit;
  font-size: 0.8rem;
  font-weight:700;
  letter-spacing:0.02em;
  color:#fff;
  background: transparent;
  border: 1.4px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  cursor:pointer;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.custom-btn:hover{
  border-color: var(--accent);
  background: rgba(255,255,255,0.05);
}

@media (max-width: 480px){
  #card{ margin: 6vh auto 3rem; padding: 1.7rem 1.3rem 1.4rem; }
}

@media (prefers-reduced-motion: reduce){
  .bolt, .gate-hint{ animation: none !important; }
}
</style>
</head>
<body>

<div id="gate">
  <p class="gate-hint">cliquer pour entrer</p>
</div>

<div id="bg-layer">

    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>

</div>

<main id="card" aria-hidden="true">

    <svg viewBox="0 0 24 24" class="eye-icon"><path d="M12 5c-5.5 0-9.3 4-10.5 7 1.2 3 5 7 10.5 7s9.3-4 10.5-7c-1.2-3-5-7-10.5-7Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-7.2a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4Z"/></svg>
  </div>

  <img id="avatar" src="" alt="avatar" draggable="false">

  <h1 id="name"></h1>
  <p id="bio"></p>

  <div id="links"></div>

  <div class="divider"></div>

  <div id="player">
    <img id="cover" src="" alt="pochette">
    <div class="track-info">
      <p id="track-title"></p>
      <p id="track-artist"></p>
      <p id="track-album"></p>
    </div>
  </div>
  <div class="progress-wrap">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="player-controls">
      <p id="time"></p>
      <div class="player-actions">
        <button id="prev-btn" class="control-btn" title="Précédent">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="play-pause-btn" class="control-btn" title="Play/Pause">
          <svg id="play-pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="next-btn" class="control-btn" title="Suivant">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <div class="volume-wrap">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
    </div>
  </div>

  <div class="divider" id="divider-2"></div>

  <div id="buttons"></div>
</main>

<audio id="audio"></audio>

  const $ = (sel) => document.querySelector(sel);

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  let currentTrackIndex = 0;

  function loadTrack(index) {
    if (!CONFIG.music.enabled || !CONFIG.music.playlist.length) return;
    const track = CONFIG.music.playlist[index];
    const audio = $("#audio");

    $("#cover").src = track.cover || CONFIG.profile.avatar;
    $("#track-title").textContent = track.title;
    $("#track-artist").textContent = "by " + track.artist;
    $("#track-album").textContent = track.album ? "on " + track.album : "";
    audio.src = track.src;
  }

  function applyProfile() {
    document.title = CONFIG.profile.name;
    $("#avatar").src = CONFIG.profile.avatar;
    $("#name").textContent = CONFIG.profile.name;
    $("#bio").textContent = CONFIG.profile.bio;

    document.documentElement.style.setProperty("--accent", CONFIG.theme.accent);

    if (!CONFIG.background.lightning) {
      $("#lightning").style.display = "none";
    }

    const linksEl = $("#links");
    CONFIG.links.forEach((l) => {
      const a = document.createElement("a");
      a.className = "link-btn";
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = ICONS[l.icon] || ICONS.link;
      linksEl.appendChild(a);
    });

    if (CONFIG.music.enabled && CONFIG.music.playlist.length > 0) {
      loadTrack(currentTrackIndex);
    } else {
      $("#player").style.display = "none";
      $(".progress-wrap").style.display = "none";
    }

    const btnsEl = $("#buttons");
    if (!CONFIG.buttons || CONFIG.buttons.length === 0) {
      $("#divider-2").style.display = "none";
    }
    (CONFIG.buttons || []).forEach((b) => {
      const btn = document.createElement("button");
      btn.className = "custom-btn";
      btn.textContent = b.label;
      btn.addEventListener("click", () => {
        if (b.copy) {
          navigator.clipboard.writeText(b.value).then(() => {
            const original = btn.textContent;
            btn.textContent = "Copié !";
            setTimeout(() => { btn.textContent = original; }, 1400);
          });
        } else {
          window.open(b.value, "_blank", "noopener,noreferrer");
        }
      });
      btnsEl.appendChild(btn);
    });
  }

  function setupPlayer() {
    if (!CONFIG.music.enabled) return;
    const audio = $("#audio");
    const bar = $("#progress-bar");
    const fill = $("#progress-fill");
    const time = $("#time");
    const playPauseBtn = $("#play-pause-btn");
    const playPauseIcon = $("#play-pause-icon");
    const nextBtn = $("#next-btn");
    const prevBtn = $("#prev-btn");
    const volumeSlider = $("#volume-slider");

    audio.addEventListener("timeupdate", () => {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      fill.style.width = pct + "%";
      time.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
    });
    audio.addEventListener("loadedmetadata", () => {
      time.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
    });

    audio.addEventListener("ended", () => {
      currentTrackIndex = (currentTrackIndex + 1) % CONFIG.music.playlist.length;
      loadTrack(currentTrackIndex);
      audio.play().catch(() => {});
    });

    nextBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex + 1) % CONFIG.music.playlist.length;
      loadTrack(currentTrackIndex);
      audio.play().catch(() => {});
    });

    prevBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex - 1 + CONFIG.music.playlist.length) % CONFIG.music.playlist.length;
      loadTrack(currentTrackIndex);
      audio.play().catch(() => {});
    });

    bar.addEventListener("click", (e) => {
      const rect = bar.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = ratio * audio.duration;
    });

    const updatePlayPauseIcon = () => {
      if (audio.paused) {
        playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      } else {
        playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      }
    };

    playPauseBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", updatePlayPauseIcon);
    audio.addEventListener("pause", updatePlayPauseIcon);

    audio.volume = volumeSlider.value;
    volumeSlider.addEventListener("input", (e) => {
      audio.volume = e.target.value;
    });
  }

  function setupViews() {
    const viewsEl = $("#views");
    if (!CONFIG.views || !CONFIG.views.enabled) {
      viewsEl.parentElement.style.display = "none";
      return;
    }

    const cfg = CONFIG.views;
    const STORAGE_KEY_VIEWS = "cve_site_views";
    const STORAGE_KEY_TIME = "cve_last_view_update";

    let currentViews = parseInt(localStorage.getItem(STORAGE_KEY_VIEWS), 10);
    let lastUpdate = parseInt(localStorage.getItem(STORAGE_KEY_TIME), 10);

    const now = Date.now();
    const intervalMs = cfg.intervalDays * 24 * 60 * 60 * 1000;

    if (isNaN(currentViews)) {
      currentViews = cfg.initialViews;
      localStorage.setItem(STORAGE_KEY_VIEWS, currentViews);
      localStorage.setItem(STORAGE_KEY_TIME, now);
    } else {
      // Vérifie si le délai est passé, même si personne n'est venu
      if (isNaN(lastUpdate)) lastUpdate = now;
      
      const elapsed = now - lastUpdate;
      if (elapsed >= intervalMs) {
        const periodsPassed = Math.floor(elapsed / intervalMs);
        currentViews += periodsPassed * cfg.increment;
        localStorage.setItem(STORAGE_KEY_VIEWS, currentViews);
        localStorage.setItem(STORAGE_KEY_TIME, lastUpdate + (periodsPassed * intervalMs));
      }
    }

    viewsEl.textContent = currentViews.toLocaleString("fr-FR");
  }

  function setupGate() {
    const gate = $("#gate");
    const card = $("#card");
    gate.addEventListener("click", () => {
      gate.classList.add("hidden");
      card.classList.add("reveal");
      card.setAttribute("aria-hidden", "false");
      if (CONFIG.music.enabled && CONFIG.music.autoplay) {
        $("#audio").play().catch(() => {});
      }
    }, { once: true });
  }

  document.addEventListener("DOMContentLoaded", () => {
    applyProfile();
    setupPlayer();
    setupGate();
    setupViews();
  });
})();
</script>
</body>
</html>
